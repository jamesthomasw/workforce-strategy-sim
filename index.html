<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workforce Strategy Simulation — Control Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --g-950:#10151A; --g-900:#171F25; --g-850:#1C252C; --g-800:#222C33; --g-750:#2A343C;
  --line:#3A454E; --line-soft:#2A343C;
  --text-1:#EDF1F3; --text-2:#9DACB5; --text-3:#67757D;
  --amber:#E8A33D; --amber-soft:#4A3A20; --amber-line:#6B5327;
  --cyan:#4FB0C6; --cyan-soft:#1E3A40;
  --green:#5FA777; --green-soft:#1E362A;
  --red:#D1574B; --red-soft:#3A2220;
  --gold:#D4AF6A; --silver:#B9C4CB;
  --radius:3px;
  --font-d:'IBM Plex Sans',sans-serif;
  --font-m:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--g-950);
  color:var(--text-1);
  font-family:var(--font-d);
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
}
button{font-family:var(--font-d);cursor:pointer;}
input,select,textarea{font-family:var(--font-d);}
a{color:var(--cyan);}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:.01em;}
p{margin:0;}
::selection{background:var(--amber-soft);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:var(--g-900);}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;}

.mono{font-family:var(--font-m);}
.small{font-size:12px;}
.dim{color:var(--text-2);}
.dimmer{color:var(--text-3);}

/* ---------- layout shells ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg,var(--g-900),var(--g-850));
  flex-wrap:wrap;gap:10px;
}
.topbar-left{display:flex;align-items:center;gap:14px;}
.topbar-brand{display:flex;flex-direction:column;line-height:1.1;}
.topbar-brand .t1{font-size:12px;letter-spacing:.08em;color:var(--text-3);text-transform:uppercase;}
.topbar-brand .t2{font-size:15px;font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

.team-chip{
  display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--g-850);
}
.color-dot{width:10px;height:10px;border-radius:2px;flex:none;}

.readout{
  display:flex;flex-direction:column;align-items:flex-end;padding:2px 10px;border-left:1px solid var(--line-soft);
}
.readout .label{font-size:10px;letter-spacing:.08em;color:var(--text-3);text-transform:uppercase;}
.readout .value{font-family:var(--font-m);font-size:16px;font-weight:600;}

.timer-box{
  display:flex;flex-direction:column;align-items:center;padding:4px 14px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--g-850);min-width:88px;
}
.timer-box .label{font-size:10px;letter-spacing:.08em;color:var(--text-3);text-transform:uppercase;}
.timer-box .value{font-family:var(--font-m);font-size:20px;font-weight:700;}
.timer-box.warn .value{color:var(--amber);}
.timer-box.danger .value{color:var(--red);}
.timer-box.off .value{color:var(--text-3);}

/* ---------- panel / card chrome ---------- */
.panel{
  position:relative;background:var(--g-900);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:16px;
}
.phase-panel{margin-bottom:18px;}
.phase-control-stack{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-top:16px;}
.panel::before,.panel::after{
  content:"";position:absolute;width:9px;height:9px;top:-1px;
  border-top:1px solid var(--amber);pointer-events:none;
}
.panel::before{left:-1px;border-left:1px solid var(--amber);}
.panel::after{right:-1px;border-right:1px solid var(--amber);}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
.panel-head h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);}
.panel-head .hint{font-size:11px;color:var(--text-3);}

.stack{display:flex;flex-direction:column;gap:14px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.main{flex:1;display:flex;}
.content{flex:1;padding:18px;max-width:1400px;margin:0 auto;width:100%;}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line);background:var(--g-850);color:var(--text-1);
  padding:8px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;
  transition:border-color .12s,background .12s;
}
.btn:hover{border-color:var(--text-2);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-amber{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber);}
.btn-amber:hover{border-color:var(--amber);}
.btn-cyan{background:var(--cyan-soft);border-color:#2E5A63;color:var(--cyan);}
.btn-red{background:var(--red-soft);border-color:#6E332C;color:var(--red);}
.btn-green{background:var(--green-soft);border-color:#3A5F46;color:var(--green);}
.btn-phase-action{margin-top:16px;padding:11px 18px;}
.btn-ghost{background:transparent;border-color:var(--line-soft);color:var(--text-2);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-block{width:100%;}

/* ---------- badges / status ---------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:2px;
  font-size:11px;letter-spacing:.04em;font-weight:600;border:1px solid transparent;
}
.badge-gold{background:#3A2E13;color:var(--gold);border-color:#5C4A24;}
.badge-silver{background:#262C30;color:var(--silver);border-color:#3F4A51;}
.badge-locked{background:var(--g-850);color:var(--text-3);border-color:var(--line-soft);}
.badge-open{background:var(--green-soft);color:var(--green);border-color:#3A5F46;}
.badge-warn{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line);}
.badge-danger{background:var(--red-soft);color:var(--red);border-color:#6E332C;}

.dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.dot-green{background:var(--green);box-shadow:0 0 6px var(--green);}
.dot-amber{background:var(--amber);box-shadow:0 0 6px var(--amber);}
.dot-red{background:var(--red);box-shadow:0 0 6px var(--red);}
.dot-off{background:var(--text-3);}

/* ---------- tabs / nav ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;margin-bottom:16px;}
.tab{
  padding:9px 14px;font-size:12.5px;color:var(--text-2);border-bottom:2px solid transparent;
  background:transparent;border-top:none;border-left:none;border-right:none;
}
.tab.active{color:var(--text-1);border-bottom-color:var(--amber);}
.tab:disabled{color:var(--text-3);opacity:.4;}

.sidenav{width:190px;flex:none;border-right:1px solid var(--line-soft);padding:16px 10px;background:var(--g-900);}
.sidenav-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 12px;border-radius:var(--radius);
  background:transparent;border:1px solid transparent;color:var(--text-2);font-size:13px;margin-bottom:2px;
}
.sidenav-item.active{background:var(--g-850);border-color:var(--line-soft);color:var(--text-1);}
.sidenav-item:hover{color:var(--text-1);}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);
  padding:6px 10px;border-bottom:1px solid var(--line);font-weight:600;
}
td{padding:8px 10px;border-bottom:1px solid var(--line-soft);}
tr:last-child td{border-bottom:none;}

/* ---------- talent card ---------- */
.talent-card{
  border:1px solid var(--line-soft);background:var(--g-850);border-radius:var(--radius);
  padding:10px;display:flex;flex-direction:column;gap:8px;
}
.talent-card.taken{opacity:.4;}
.talent-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.talent-name{font-weight:600;font-size:13.5px;}
.skillbars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.skillbar{display:flex;flex-direction:column;align-items:center;gap:2px;}
.skillbar .lbl{font-size:9px;color:var(--text-3);font-family:var(--font-m);}
.skillbar .track{width:100%;height:22px;background:var(--g-800);border:1px solid var(--line-soft);position:relative;border-radius:2px;overflow:hidden;}
.skillbar .fill{position:absolute;bottom:0;left:0;right:0;background:var(--cyan);}
.skillbar.specialty .lbl{color:var(--amber);font-weight:700;}
.skillbar.specialty .track{border-color:var(--amber-line);}
.skillbar.specialty .fill{background:var(--amber);}
.skillbar .val{font-size:9px;font-family:var(--font-m);color:var(--text-2);}
.area-key{display:flex;flex-wrap:wrap;gap:10px;}
.area-key-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line-soft);border-radius:3px;background:var(--g-850);font-size:12px;}
.area-key-label{color:var(--amber);font-family:var(--font-m);font-weight:700;font-size:13px;}
.recruitment-warning{padding:12px 14px;border:1px solid var(--amber);border-left:4px solid var(--amber);border-radius:var(--radius);background:var(--amber-soft);color:var(--text-1);font-size:13px;line-height:1.45;}
.recruitment-warning strong{color:var(--amber);}

/* ---------- planning board ---------- */
.tray{
  display:flex;gap:10px;flex-wrap:wrap;padding:12px;border:1px dashed var(--line);border-radius:var(--radius);
  background:var(--g-850);min-height:70px;
}
.tray-card{
  border:1px solid var(--line);background:var(--g-800);border-radius:var(--radius);padding:8px 10px;
  cursor:grab;min-width:150px;
}
.tray-card:active{cursor:grabbing;}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
@media(max-width:900px){.board{grid-template-columns:1fr;}}
.area-col{border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--g-900);min-height:150px;display:flex;flex-direction:column;}
.area-head{
  padding:8px 10px;border-bottom:1px solid var(--line-soft);font-family:var(--font-m);font-weight:700;
  font-size:13px;color:var(--amber);display:flex;justify-content:space-between;align-items:center;
}
.area-body{flex:1;padding:8px;display:flex;flex-direction:column;gap:8px;}
.area-body.dragover{background:var(--amber-soft);}
.area-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:12px;border:1px dashed var(--line-soft);border-radius:var(--radius);min-height:60px;}
.placement-attributes{display:grid;gap:3px;margin-top:7px;}
.placement-attribute{display:flex;justify-content:space-between;gap:6px;padding:3px 5px;border:1px solid var(--line-soft);border-radius:3px;font-size:10px;color:var(--text-2);}
.placement-attribute.active{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:700;}

/* ---------- leaderboard ---------- */
.lb-row{
  display:grid;grid-template-columns:36px 1fr auto auto auto auto;gap:12px;align-items:center;
  padding:10px 12px;border-bottom:1px solid var(--line-soft);
}
.lb-rank{font-family:var(--font-m);font-weight:700;font-size:16px;color:var(--text-2);}
.lb-rank.gold{color:var(--gold);}
.lb-rank.silver{color:var(--silver);}
.lb-rank.bronze{color:#C47A52;}
.lb-score{font-family:var(--font-m);text-align:right;}
.lb-score .num{font-size:15px;font-weight:700;}
.lb-score .lbl{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;}

/* ---------- events ---------- */
.event-card{border:1px solid var(--line-soft);border-radius:var(--radius);padding:10px 12px;background:var(--g-850);display:flex;gap:12px;align-items:flex-start;}
.event-card.unresolved{border-color:var(--red);background:var(--red-soft);}
.event-icon{width:30px;height:30px;flex:none;border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:var(--font-m);font-weight:700;font-size:12px;background:var(--g-800);border:1px solid var(--line);}

/* ---------- misc forms ---------- */
input[type=text],input[type=number],input[type=password],select,textarea{
  background:var(--g-850);border:1px solid var(--line);color:var(--text-1);padding:8px 10px;border-radius:var(--radius);
  font-size:13px;width:100%;
}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px;}
label{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;}
.field{margin-bottom:12px;}
textarea{resize:vertical;min-height:120px;}

.progress-track{height:6px;background:var(--g-800);border-radius:3px;overflow:hidden;border:1px solid var(--line-soft);}
.progress-fill{height:100%;background:var(--amber);}
.round-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 16px;}
.round-flow-step{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line-soft);background:var(--g-850);border-radius:var(--radius);color:var(--text-3);}
.round-flow-step.active{border-color:var(--amber-line);background:var(--amber-soft);color:var(--amber);}
.round-flow-step.done{border-color:#3A5F46;background:var(--green-soft);color:var(--green);}
.round-flow-step .step-number{display:grid;place-items:center;width:22px;height:22px;border:1px solid currentColor;border-radius:50%;font:600 11px var(--font-m);flex:none;}
.tree-entry-panel{margin-top:14px;border-color:#2E5A63;background:linear-gradient(135deg,var(--g-900),#17282D);}
.tree-entry-panel .panel-head h3{color:var(--cyan);}
.tree-entry-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.tree-entry-card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border:1px solid var(--line-soft);background:var(--g-850);border-radius:var(--radius);}
.tree-entry-card.complete{border-color:#3A5F46;}
.tree-entry-card label{font-weight:600;}
.tree-entry-card input{width:76px;padding:7px 8px;text-align:center;font:600 15px var(--font-m);color:var(--text-1);background:var(--g-950);border:1px solid var(--line);border-radius:var(--radius);}
.tree-entry-card input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan-soft);}
.tree-entry-card.complete input{border-color:#3A5F46;color:var(--green);}
.tree-entry-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);}
.dart-panel{margin-top:14px;border-color:var(--amber-line);background:linear-gradient(135deg,var(--g-900),#29251C);}
.dart-panel .panel-head h3{color:var(--amber);}
.dart-legend{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0;padding:9px 11px;border-left:2px solid var(--amber);background:var(--g-850);color:var(--text-2);font-size:12px;}
.dart-panel select{min-width:145px;padding:6px 8px;color:var(--text-1);background:var(--g-950);border:1px solid var(--line);border-radius:var(--radius);}
.dart-panel select:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-soft);}
@media(max-width:700px){.round-flow{grid-template-columns:1fr;}.tree-entry-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:420px){.tree-entry-grid{grid-template-columns:1fr;}}

.login-shell{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;
  background:
    radial-gradient(circle at 15% 20%, rgba(79,176,198,.06), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(232,163,61,.06), transparent 40%),
    var(--g-950);
}
.login-card{width:100%;max-width:420px;}
.login-title{font-size:20px;margin-bottom:4px;}
.login-sub{color:var(--text-3);font-size:12.5px;margin-bottom:20px;}

.footer-tick{padding:8px 20px;border-top:1px solid var(--line-soft);color:var(--text-3);font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}

.toast{
  position:fixed;bottom:20px;right:20px;background:var(--g-850);border:1px solid var(--line);
  padding:10px 16px;border-radius:var(--radius);font-size:13px;z-index:999;box-shadow:0 6px 24px rgba(0,0,0,.4);
  border-left:3px solid var(--cyan);
}
.toast.warn{border-left-color:var(--amber);}
.toast.err{border-left-color:var(--red);}

.modal-overlay{
  position:fixed;inset:0;background:rgba(8,11,14,.72);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal-box{
  width:100%;max-width:420px;background:var(--g-900);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;position:relative;
}
.modal-box::before,.modal-box::after{
  content:"";position:absolute;width:9px;height:9px;top:-1px;
  border-top:1px solid var(--red);pointer-events:none;
}
.modal-box::before{left:-1px;border-left:1px solid var(--red);}
.modal-box::after{right:-1px;border-right:1px solid var(--red);}
.modal-title{font-size:14px;font-weight:600;margin-bottom:8px;}
.modal-msg{color:var(--text-2);font-size:13px;margin-bottom:18px;line-height:1.5;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;}

.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;}
.kv:last-child{border-bottom:none;}
</style>

<script>
/* =========================================================================
   WORKFORCE STRATEGY SIMULATION — CONTROL DECK
   Single-file SPA: state store + scoring engine + disruption engine +
   phase controller + render layer. No frameworks, local persistence only.
   ========================================================================= */

const STORAGE_KEY = 'wfsim_state_v2';
const LOCAL_UI_KEY = 'wfsim_local_ui_v1';
const SHARED_SESSION_ID = 'default';
const TEAM_CODES = ['T1-ALPHA','T2-BRAVO','T3-CHARLIE','T4-DELTA','T5-ECHO','T6-FOXTROT','T7-GOLF','T8-HOTEL','T9-INDIA','T10-JULIET'];
// Replace these values with the Firebase Web App config for the deployment.
const FIREBASE_CONFIG = {

  authDomain: 'workforce-strategy-sim.firebaseapp.com',

  projectId: 'workforce-strategy-sim',

  messagingSenderId: '761657063147',
  appId: '1:761657063147:web:214381d762f177edbb30ae'
};
const AREAS = ['A','B','C','D','E'];
const AREA_NAMES = {A:'Chip Screening',B:'Digester',C:'Washing',D:'Bleaching',E:'HDT'};
const FACILITATOR_KEY = 'FACILITATOR';

/* ---------------------------- deterministic RNG ---------------------------- */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(20260701);
function ri(min,max){ return Math.floor(rng()*(max-min+1))+min; }
function pick(arr){ return arr[Math.floor(rng()*arr.length)]; }
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }

const FIRST = ['Ade','Bina','Chandra','Dewi','Erik','Farah','Gilang','Hana','Indra','Joko','Kirana','Lestari','Made','Nia','Omar','Putri','Rafi','Sari','Taufik','Uma','Vikram','Wulan','Yusuf','Zahra','Bram','Citra','Dian','Fajar','Galih','Hendra'];
const LAST = ['Wijaya','Santoso','Pratama','Kusuma','Halim','Setiawan','Gunawan','Wibowo','Suryadi','Hartono','Yulianto','Kurniawan','Saputra','Handoko','Nugroho','Firmansyah','Salim','Chandra','Permata','Utomo'];

function genName(usedNames){
  let n;
  do{ n = pick(FIRST)+' '+pick(LAST); } while(usedNames.has(n));
  usedNames.add(n);
  return n;
}

function buildTalentPool(){
  const used = new Set();
  const talents = [];
  // Gold talent is consistently excellent: every work area is at least 80,
  // with a narrow spread, and higher cost yields a higher overall profile.
  for(let i=0;i<12;i++){
    const cost = ri(72,98);
    const base = 82 + Math.round((cost-72)*0.32); // 82–90, tied to cost
    const skills = {};
    AREAS.forEach(a=>skills[a]=Math.max(80, Math.min(96, base+ri(-3,3))));
    talents.push({
      id: 'tal_'+(i+1), name: genName(used), tier:'Gold',
      cost, skills, originalSkills:Object.assign({}, skills), learning:0, recruitedBy:null, active:true, history:[]
    });
  }
  // Silver talent scales with cost. A talent may have one strong specialty,
  // but no Silver profile can overlap Gold's consistently high capability.
  for(let i=0;i<44;i++){
    const cost = ri(15,55);
    const base = 24 + Math.round((cost-15)*0.85); // 24–58, tied to cost
    const skills = {};
    const specialty = pick(AREAS);
    AREAS.forEach(a=>skills[a]=Math.max(18, Math.min(50, base+ri(-5,5))));
    skills[specialty] = Math.max(72, Math.min(88, 68 + Math.round((cost-15)*0.45) + ri(-2,2)));
    talents.push({
      id: 'tal_'+(i+1+12), name: genName(used), tier:'Silver',
      specialty, cost, skills, originalSkills:Object.assign({}, skills), learning:0, recruitedBy:null, active:true, history:[]
    });
  }
  return talents;
}

function initSharedSync(){
  if(!firebaseConfigured()){
    console.warn('Firebase shared session is not configured; using browser-local persistence.');
    return;

  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    firebase.auth().signInAnonymously().then(function(){
      sharedDb = firebase.database().ref('sessions/'+SHARED_SESSION_ID);
      sharedDb.on('value', function(snapshot){
        const remote = snapshot.val();
        if(!remote){
          save();
          return;
        }
        const localRole = state.role || null;
        const localUi = state.ui || { route:'login', teamTab:'dashboard', adminTab:'teams', loginMode:null, selectedEventTeam:'', selectedEventType:'Retirement', selectedEventTalent:'' };
        applyingRemoteState = true;
        state = normalizeTeamCodes(remote);
        state.role = localRole;
        state.ui = localUi;
        applyingRemoteState = false;
        window.__draft = {};
        render();
      }, function(error){
        console.error('Unable to read shared session.', error);
        toast('Shared session could not be loaded.', 'err');
      });
    }).catch(function(error){
      console.error('Unable to authenticate shared session.', error);
      toast('Shared session authentication failed.', 'err');

  }catch(error){
    console.error('Unable to initialize shared session.', error);

/* ============================== SCORING ENGINE ============================== */

function teamRoster(team){
  return team.roster.map(id => state.talents.find(t=>t.id===id)).filter(Boolean);
}

function computeStartingBudget(evpScore){
  return Math.round(evpScore * state.session.evpMultiplier);
}
function judgeCount(){ return clampJudgeCount(state.session.numJudges===undefined ? 3 : state.session.numJudges); }
function calculateEVPScore(team){
  const totals = team.evpJudgeTotals || [];
  if(Array.from({length:judgeCount()},(_,judge)=>totals[judge]).some(value=>value===undefined || value===null || value==='')) return null;
  return Math.round(totals.slice(0,judgeCount()).reduce((sum,total)=>sum+Number(total),0)/judgeCount());
}
function setJudgeCount(value){
  state.session.numJudges = clampJudgeCount(value);
  state.teams.forEach(team=>{ team.evpScore = calculateEVPScore(team); });
  persistAndRender();
}
function setEVPJudgeTotal(teamId, judgeIndex, value){
  const team = state.teams.find(t=>t.id===teamId);
  if(!team || state.phaseStatus.evp==='closed') return;
  if(!team.evpJudgeTotals) team.evpJudgeTotals = [];
  if(value==='') delete team.evpJudgeTotals[judgeIndex];
  else team.evpJudgeTotals[judgeIndex] = Math.max(0, Math.min(100, parseInt(value,10)||0));
  team.evpScore = calculateEVPScore(team);
  save();
  const average = document.getElementById('evpAverage_'+teamId);
  if(average) average.textContent = team.evpScore===null ? '—' : team.evpScore;
}

function currentAssignmentsFor(teamId, round){
  return state.assignments.filter(a=>a.teamId===teamId && a.round===round);
}
function priorAssignmentsFor(teamId, talentId, beforeRound){
  return state.assignments.filter(a=>a.teamId===teamId && a.talentId===talentId && a.round < beforeRound);
}

function exposureTypeFor(teamId, talentId, area, round){
  const prior = priorAssignmentsFor(teamId, talentId, round).sort((a,b)=>a.round-b.round);
  const talent = state.talents.find(t=>t.id===talentId);
  if(talent && talent.specialty===area) return 'Specialization';
  if(talent && !talent.specialty && prior.length && prior[prior.length-1].area===area) return 'Specialization';
  return prior.some(p=>p.area===area) ? 'Repeated' : 'New';
}
function standardLearningIncrement(skill){
  if(skill < 40) return 20;
  if(skill < 60) return 15;
  if(skill < 80) return 12;
  return 8;
}
function additionalExposureIncrement(teamId, talentId, area, round, type){
  const talent = state.talents.find(t=>t.id===talentId);
  if(talent && talent.tier==='Gold') return 0;
  if(type==='Specialization') return 0;
  const priorSameArea = priorAssignmentsFor(teamId, talentId, round).filter(a=>a.area===area).length;
  if(priorSameArea===0) return 10;
  if(priorSameArea===1) return 5;
  return 0;
}

// Called when a team locks their assignment for a round (creates Assignment records)
function commitAssignment(team, round, placements){
  // placements: {area: talentId}
  const validation = validateDraftPlacements(team, placements);
  if(!validation.valid){
    console.warn('Blocked invalid assignment: '+validation.reason);
    return;
  }
  AREAS.forEach(area=>{
    const talentId = placements[area];
    if(!talentId) return;
    const type = exposureTypeFor(team.id, talentId, area, round);
    const talent = state.talents.find(t=>t.id===talentId);
    const skillBefore = Number(talent.skills[area]) || 0;
    const standardIncrement = standardLearningIncrement(skillBefore);
    const exposureBonus = additionalExposureIncrement(team.id, talentId, area, round, type);
    const totalIncrement = standardIncrement + exposureBonus;
    talent.skills[area] = Math.min(100, skillBefore + totalIncrement);
    const learningBefore = talent.learning || 0;
    talent.learning = Math.min(100, learningBefore + totalIncrement);
    state.assignments.push({
      id: uid('asg'), teamId: team.id, talentId, area, round,
      exposureType: type, standardIncrement, exposureBonus, totalIncrement,
      points: talent.learning - learningBefore
    });
    talent.history.push({round, area, standardIncrement, exposureBonus});
  });
}

function computeOperationalForRound(team, round){
  const asg = currentAssignmentsFor(team.id, round);
  if(asg.length===0) return 0;
  let sum = 0;
  asg.forEach(a=>{
    const talent = state.talents.find(t=>t.id===a.talentId);
    if(talent) sum += talent.skills[a.area];
  });
  let score = sum; // cumulative score from each talent's assigned work-area attribute
  const bonus = state.rounds[round-1] && state.rounds[round-1].bonus[team.id] ? state.rounds[round-1].bonus[team.id] : 0;
  return Math.round(score + bonus);
}

function treeMultiplier(count){
  const c = foldingControl();
  if(count <= c.underTargetMax) return c.belowMultiplier;
  if(count < c.targetMin) return c.neutralMultiplier;
  if(count <= c.targetMax) return c.targetMultiplier;
  if(count <= c.overachieveMax) return c.overachieveMultiplier;
  return c.exceedMultiplier;
}
function treeBandLabel(count){
  const c = foldingControl();
  if(count <= c.underTargetMax) return 'Below target';
  if(count < c.targetMin) return 'Neutral';
  if(count <= c.targetMax) return 'Budget achieved';
  if(count <= c.overachieveMax) return 'Overachieved';
  return 'Exceeded';
}
function setFoldingSetting(field, value){
  const c = foldingControl();
  if(field==='minutes') c.minutes = Math.max(1, Math.min(60, parseInt(value,10)||10));
  else if(field==='budget'){
    c.budget = Math.max(0, parseInt(value,10)||0);
    c.underTargetMax = Math.max(0, c.budget-7);
    c.targetMin = Math.max(0, c.budget-2);
    c.targetMax = c.budget;
    c.overachieveMax = c.budget+4;
  }
  else if(['underTargetMax','targetMin','targetMax','overachieveMax'].indexOf(field)>=0) c[field] = Math.max(0, parseInt(value,10)||0);
  else c[field] = Math.max(0, Number(value)||0);
  persistAndRender();
}

function computeReadiness(team){
  const roster = teamRoster(team);
  if(roster.length===0) return 0;
  const assignments = state.assignments.filter(a=>a.teamId===team.id);
  const averageSkillGrowth = assignments.reduce((sum,a)=>sum+(Number.isFinite(Number(a.totalIncrement)) ? Number(a.totalIncrement) : (Number(a.points)||0)),0) / roster.length;
  const scoredRounds = state.rounds.filter(r=>r.status==='scored');
  let rotationBonus = 0;
  scoredRounds.forEach(round=>{
    const previousRound = round.number > 1 ? currentAssignmentsFor(team.id, round.number-1) : [];
    const currentRound = currentAssignmentsFor(team.id, round.number);
    if(!previousRound.length || !currentRound.length) return;
    const previousByTalent = {};
    previousRound.forEach(a=>{ previousByTalent[a.talentId] = a.area; });
    const rotated = currentRound.filter(a=>previousByTalent[a.talentId] && previousByTalent[a.talentId]!==a.area).length;
    if(rotated > roster.length/2) rotationBonus += 5;
  });
  const successionReady = roster.filter(t=>t.tier==='Silver' && AREAS.filter(area=>t.skills[area]>75).length>3).length;
  const successionBonus = successionReady>=3 ? 15 : successionReady===2 ? 10 : successionReady===1 ? 5 : 0;
  return Math.min(40, Math.round(Math.min(20, averageSkillGrowth) + rotationBonus + successionBonus));
}

function computeComplementary(team){
  const roster = teamRoster(team);
  if(roster.length===0) return 0;
  let sum = 0;
  AREAS.forEach(a=>{
    const best = Math.max(0,...roster.map(t=>t.skills[a]));
    sum += best;
  });
  return Math.round(sum / AREAS.length);
}
function calculateFinalScore(team){
  return Math.round(
    team.operationalPoints +
    Math.min(40, team.readiness) +
    Math.min(20, team.complementary)
  );
}

function recomputeTeamScores(team){
  const scoredRounds = state.rounds.filter(r=>r.status==='scored' && r.results[team.id]!==undefined);
  team.rawOperational = scoredRounds.reduce(function(sum,r){
    return sum + (r.treeResults[team.id] ? r.treeResults[team.id].base : r.results[team.id]);
  },0);
  team.operational = scoredRounds.reduce((s,r)=>s+r.results[team.id],0);
  team.readiness = computeReadiness(team);
  team.complementary = computeComplementary(team);
}

function recomputeAllScores(){
  state.teams.forEach(recomputeTeamScores);
  const finalRound = state.rounds.filter(r=>r.status==='scored').slice(-1)[0];
  const finalScores = state.teams.map(team=>finalRound && finalRound.results[team.id]!==undefined ? finalRound.results[team.id] : 0);
  const highestFinalRoundScore = Math.max(0,...finalScores);
  state.teams.forEach(team=>{
    const score = finalRound && finalRound.results[team.id]!==undefined ? finalRound.results[team.id] : 0;
    team.operationalPoints = highestFinalRoundScore > 0 ? (score / highestFinalRoundScore) * 40 : 0;
    team.final = calculateFinalScore(team);
  });
}

function triggerDisruptionEvent(type, targetTeamId, targetTalentId){
  const team = state.teams.find(t=>t.id===targetTeamId);
  const talent = state.talents.find(t=>t.id===targetTalentId);
  if(!team || !talent) return;
  const round = state.session.currentRound;
  let description = '';

  function clearCurrentRoundPlacement(){
    const idx = state.assignments.findIndex(a=>a.teamId===team.id && a.talentId===talent.id && a.round===round);
    if(idx>=0) state.assignments.splice(idx,1);
    // also reopen round submission for this team if it was locked
    const r = state.rounds[round-1];
    if(r) r.teamSubs[team.id] = false;
  }

  if(type==='Retirement'){
    talent.active = false;
    clearCurrentRoundPlacement();
    description = talent.name+' has retired and permanently exits '+team.name+"'s roster. The vacated area must be backfilled or left unproduced.";
  } else if(type==='Rotation'){
    clearCurrentRoundPlacement();
    description = talent.name+' has been force-rotated out of their current placement. '+team.name+' must re-place them before locking this round.';
  } else if(type==='Resignation'){
    talent.active = false;
    talent.recruitedBy = null;
    team.roster = team.roster.filter(id=>id!==talent.id);
    clearCurrentRoundPlacement();
    description = talent.name+' has resigned and left '+team.name+'. A replacement may be sourced from the Marketplace if budget allows.';
  } else if(type==='LEAP'){
    clearCurrentRoundPlacement();
    const r = state.rounds[round-1];
    if(r){ r.bonus[team.id] = (r.bonus[team.id]||0) + 10; }
    description = talent.name+' has been placed on a LEAP lateral-expansion assignment: rotated out this round, but '+team.name+' earns a +10 Operational bonus this round to reflect the growth opportunity.';
  }

  state.events.unshift({
    id: uid('evt'), type, targetTeamId, targetTalentId,
    round, description, status:'Triggered'
  });
  logAction('DisruptionTrigger', targetTeamId, type+' → '+talent.name);
}

  const round = state.session.currentRound;
  const r = state.rounds[round-1];
  if(!r || r.folding.status==='locked' || r.folding.status==='running'){
    toast('Complete the origami tree folding challenge before scoring the round.', 'warn');
    return;
  }
  const missing = state.teams.filter(team=>r.treeSubs[team.id]===undefined || r.treeSubs[team.id]===null);
  if(missing.length){
    toast('Enter folded tree totals for every team before scoring.', 'warn');
    return;
  }
  state.teams.forEach(team=>{
    const base = computeOperationalForRound(team, round);
    const trees = Number(r.treeSubs[team.id]);
    const multiplier = treeMultiplier(trees);
    r.treeResults[team.id] = { trees, base, multiplier, band:treeBandLabel(trees), score:Math.round(base*multiplier) };
    r.results[team.id] = r.treeResults[team.id].score;
  });
  r.status = 'scored';
  recomputeAllScores();
  logAction('ScoreEntry', null, 'Round '+round+' scored');
  persistAndRender();

function talentCardMarket(t, team){
  const taken = !!t.recruitedBy;
  const goldFull = team.roster.some(id=>{const x=state.talents.find(tt=>tt.id===id); return x&&x.tier==='Gold';});
  const silverCount = team.roster.filter(id=>{const x=state.talents.find(tt=>tt.id===id); return x&&x.tier==='Silver';}).length;
  let disableReason = '';
  if(state.phaseStatus.marketplace!=='open') disableReason = 'Recruitment not open';
  else if(taken) disableReason = 'Recruited';
  else if(t.tier==='Gold' && goldFull) disableReason = 'Gold slot filled';
  else if(t.tier==='Silver' && silverCount>=4) disableReason = 'Silver slots filled';

  const badgeClass = t.tier==='Gold' ? 'badge-gold' : 'badge-silver';
  return '<div class="talent-card'+(taken?' taken':'')+'">'
    +'<div class="talent-top"><div><div class="talent-name">'+esc(t.name)+'</div>'
    +'<span class="badge '+badgeClass+'">'+t.tier+'</span>'+(t.specialty?'<div class="small" style="color:var(--amber);margin-top:4px;">Specialty: '+esc(AREA_NAMES[t.specialty])+' ('+t.specialty+')</div>':'')+'</div>'
    +'<div class="mono" style="text-align:right"><div style="font-size:15px;font-weight:700;">'+t.cost+'</div><div class="dimmer" style="font-size:9px;">COINS</div></div></div>'

    +(taken
      ? '<div class="small dim">Recruited by '+esc((state.teams.find(x=>x.id===t.recruitedBy)||{}).name||'another team')+'</div>'
      : '<button class="btn btn-amber btn-sm" '+(disableReason?'disabled':'')+' onclick="recruitTalent(\''+t.id+'\')">'+(disableReason||'Recruit')+'</button>')
    +'</div>';
}

function recruitTalent(talentId){
  const team = currentTeam();
  if(!team) return;
  if(state.phaseStatus.marketplace!=='open'){
    toast('Recruitment is not open yet.', 'warn');
    return;
  }
  const t = state.talents.find(x=>x.id===talentId);
  if(!t || t.recruitedBy) return;
  const goldFull = team.roster.some(id=>{const x=state.talents.find(tt=>tt.id===id); return x&&x.tier==='Gold';});
  const silverCount = team.roster.filter(id=>{const x=state.talents.find(tt=>tt.id===id); return x&&x.tier==='Silver';}).length;
  if(t.tier==='Gold' && goldFull){ toast('Your Gold slot is already filled.','warn'); return; }
  if(t.tier==='Silver' && silverCount>=4){ toast('All 4 Silver slots are filled.','warn'); return; }
  if(t.cost > team.budget){ toast('Not enough budget.','warn'); return; }
  t.recruitedBy = team.id;
  team.budget -= t.cost;
  team.roster.push(t.id);
  logAction('Recruit', team.id, 'Recruited '+t.name+' ('+t.tier+')');
  persistAndRender();
}

/* ============================== PLANNING BOARD DRAG/DROP ============================== */

let dragTalentId = null;

function boardPlacementsForTeam(team, round){
  const placements = {};
  currentAssignmentsFor(team.id, round).forEach(a=>{ placements[a.area]=a.talentId; });
  return placements;
}

function validateDraftPlacements(team, placements, requireComplete){
  const assigned = Object.values(placements).filter(Boolean);
  const completeCheck = requireComplete !== false;
  if(completeCheck && assigned.length !== AREAS.length){
    return { valid:false, reason:'Place one talent in each work area (A–E) before locking.' };
  }
  if(new Set(assigned).size !== assigned.length){
    return { valid:false, reason:'Each talent can only be assigned to one work area.' };
  }
  const rosterIds = new Set(team.roster || []);
  const invalid = assigned.filter(id => !rosterIds.has(id));
  if(invalid.length){
    return { valid:false, reason:'All assigned talents must come from the team roster.' };
  }
  return { valid:true };
}

// Draft placements kept in a transient (non-persisted) object while a team is arranging,
// so nothing commits until "Lock Assignment" is pressed.
window.__draft = window.__draft || {};
function draftFor(teamId, round){
  const key = teamId+'_'+round;
  if(!window.__draft[key]) window.__draft[key] = boardPlacementsForTeam({id:teamId}, round);
  return window.__draft[key];
}

function onDragStart(ev, talentId){ dragTalentId = talentId; ev.dataTransfer.effectAllowed='move'; }
function onDragOverZone(ev){ ev.preventDefault(); ev.currentTarget.classList.add('dragover'); }
function onDragLeaveZone(ev){ ev.currentTarget.classList.remove('dragover'); }

function onDropZone(ev, area){
  ev.preventDefault();
  ev.currentTarget.classList.remove('dragover');
  const team = currentTeam();
  if(!team || !dragTalentId) return;
  const round = state.session.currentRound;
  const key = team.id+'_'+round;
  const draft = draftFor(team.id, round);
  const talentId = dragTalentId;
  // remove talent from any other area first
  Object.keys(draft).forEach(a=>{ if(draft[a]===talentId) delete draft[a]; });
  // if the target area is already occupied by another talent, remove that one so the draft stays valid
  const existingTalentId = draft[area];
  if(existingTalentId && existingTalentId !== talentId){
    delete draft[area];
  }
  draft[area] = talentId;
  const validation = validateDraftPlacements(team, draft, false);
  if(!validation.valid){
    delete draft[area];
    if(existingTalentId && existingTalentId !== talentId){ draft[area] = existingTalentId; }
    toast(validation.reason, 'warn');
    return;
  }
  window.__draft[key] = draft;
  dragTalentId = null;
  render();
}
function onDropTray(ev){
  ev.preventDefault();
  const team = currentTeam();
  if(!team || !dragTalentId) return;
  const round = state.session.currentRound;
  const key = team.id+'_'+round;
  const draft = draftFor(team.id, round);
  Object.keys(draft).forEach(a=>{ if(draft[a]===dragTalentId) delete draft[a]; });
  window.__draft[key] = draft;
  dragTalentId = null;
  render();
}

function lockPlanningBoard(){
  const team = currentTeam();
  if(!team) return;
  const round = state.session.currentRound;
  const key = team.id+'_'+round;
  const draft = draftFor(team.id, round);
  const validation = validateDraftPlacements(team, draft, true);
  if(!validation.valid){
    toast(validation.reason, 'warn');
    return;
  }
  // remove any existing assignment rows for this team/round then commit fresh
  state.assignments = state.assignments.filter(a=>!(a.teamId===team.id && a.round===round));
  commitAssignment(team, round, draft);
  lockTeamRound(team, round);
}

    +'</tbody></table></div></div></div>';
    +'</tbody></table></div></div>';

    +(myEvents.length ? '<div class="stack">'+myEvents.map(e=>{

function renderLeaderboardScreen(team){
  if(!state.leaderboardPublished){

function renderLeaderboardTable(){
  const ranked = [...state.teams].sort((a,b)=>b.final-a.final);
  return '<div class="panel"><div class="panel-head"><h3>Leaderboard</h3><span class="hint">40% final-round proportional Operational + Multiplier · 40% Readiness · 20% Complementary</span></div>'

        +'<div class="lb-score"><div class="num">'+t.readiness+'</div><div class="lbl">Readiness</div></div>'
        +'<div class="lb-score"><div class="num">'+t.complementary+'</div><div class="lbl">Complementary</div></div>'
        +'<div class="lb-score"><div class="num" style="color:var(--amber);font-size:18px;">'+t.final+'</div><div class="lbl">Final</div></div>'
        +'</div>';

    +'</div>';
}

function renderTeamPortal(){
  const team = currentTeam();
  if(!team) return renderLogin();
  let body = '';
  switch(state.ui.teamTab){
    case 'evp': body = renderEVPWorkspace(team); break;
    case 'market': body = renderMarketplace(team); break;
    case 'board': body = renderPlanningBoard(team); break;
    case 'ops': body = renderOpsDashboard(team); break;
    case 'events': body = renderEventCenter(team); break;
    case 'leaderboard': body = renderLeaderboardScreen(team); break;
    default: body = renderTeamDashboard(team);
  }
  return '<div class="content">'+teamTabs()+body+'</div>';
}

function updateSessionField(field,val){ state.session[field]=val; persistAndRender(); }
function updateSessionRounds(value){
  const numRounds = clampRoundCount(value);
  if(numRounds===state.session.numRounds){ persistAndRender(); return; }
  if(state.session.currentRound>0){
    toast('Rounds can only be changed before Round 1 is opened.', 'warn');
    render();
    return;
  }
  state.session.numRounds = numRounds;
  state.rounds = Array.from({length:numRounds}, (_,i)=>({ number:i+1, status:'locked', teamSubs:{}, results:{}, treeResults:{}, treeSubs:{}, bonus:{}, folding:{status:'locked', endsAt:null} }));
  persistAndRender();
}

function renderAdminPhases(){

      ? '<div class="timer-box warn"><div class="label">Drafting remaining</div><div class="value" id="evpDraftTimer">'+formatTimer(timerRemaining(control.draftEndsAt))+'</div></div><button class="btn btn-red" onclick="endEVPDraftTimer()">End Drafting</button>'

    html += '<p class="dim small">Run the onsite presentations, then record each judge’s rubric scores in the Scoring tab before applying results.</p>'
      +'<div class="grid grid-2">'
      +'<div class="panel"><div class="panel-head"><h3>EVP Drafting Timer</h3><span class="hint">1–20 minutes</span></div>'
      +'<div class="field"><label>Drafting time (minutes)</label><input type="number" min="1" max="20" value="'+control.draftMinutes+'" '+(control.draftStatus==='running'||control.draftStatus==='ended'?'disabled':'')+' onchange="setEVPDraftMinutes(this.value)"></div>'
      +'<div class="row">'+draftControls+'</div>'
      +'</div>'
      +'<div class="panel"><div class="panel-head"><h3>EVP Presentation Order</h3><span class="hint">Randomized once for all teams</span></div>'

      +'<div class="row">'+presentationControls.replace('Start 3-Min Presentation:', 'Start '+control.presentationMinutes+'-Min Presentation:')+'</div>'
      +'</div></div>'
      +'<button class="btn btn-green btn-phase-action" onclick="closeEVPApplyScores()">Apply Scores &amp; Close EVP</button>';
  } else {

      +'<div class="table-wrap"><table><thead><tr><th>Team</th><th>Practice 1</th><th>Practice 2</th><th>Final throw</th><th>Bonus</th></tr></thead><tbody>'
      +state.teams.map(team=>{ const bonus=Number(team.dartBonus)||0; return '<tr><td><strong>'+esc(team.name)+'</strong></td>'+[0,1,2].map(i=>'<td><select '+(dart.status==='closed'?'disabled':'')+' onchange="recordDartThrow(\''+team.id+'\','+i+',this.value)">'+dartOptions.replace('value="'+(dart.throws[team.id+'_'+i]??'')+'"','value="'+(dart.throws[team.id+'_'+i]??'')+'" selected')+'</select></td>').join('')+'<td class="mono">'+(dart.throws[team.id+'_2']!==undefined?'+'+bonus:'—')+'</td></tr>'; }).join('')
      +'</tbody></table></div><div class="tree-entry-footer"><span class="dim small">'+(dart.status==='closed'?'All final throws recorded. Marketplace planning is now available.':'Record the final throw for every team to finish the bonus round.')+'</span><span class="mono small">'+finalThrows+'/'+state.teams.length+' final</span></div></div>';
  }
  html += '</div>';

  html += '<div class="panel phase-panel"><div class="panel-head"><h3>Phase 2 — Marketplace</h3><span class="badge '+(state.phaseStatus.marketplace==='open'?'badge-warn':state.phaseStatus.marketplace==='closed'?'badge-open':state.phaseStatus.marketplace==='planning'?'badge-warn':'badge-locked')+'">'+state.phaseStatus.marketplace+'</span></div>';
  if(state.phaseStatus.marketplace==='open'){
    html += '<p class="dim small">Rosters complete: '+state.teams.filter(t=>t.roster.length>=5).length+'/'+state.teams.length+'</p>'

      html += '<span class="badge badge-locked">Awaiting EVP scores</span>';
    } else if(evpControl().dartRound.status!=='closed'){
      html += '<span class="badge badge-locked">Complete the Dart Challenge before marketplace planning</span>';

      html += '<div class="phase-control-stack"><div class="timer-box warn"><div class="label">Marketplace planning remaining</div><div class="value" id="marketplacePlanningTimer">'+formatTimer(timerRemaining(planning.planningEndsAt))+'</div></div>'

        +'<button class="btn btn-amber" onclick="startMarketplacePlanningTimer()">Start '+planning.planningMinutes+'-Minute Planning Timer</button></div>';
    }
  }
  html += '</div>';

  if(state.phaseStatus.marketplace==='closed'){
    state.rounds.forEach(r=>{
      const isCurrent = r.number===state.session.currentRound;
      html += '<div class="panel"><div class="panel-head"><h3>Round '+r.number+'</h3><span class="badge '+(r.status==='scored'?'badge-open':r.status==='open'?'badge-warn':'badge-locked')+'">'+r.status+'</span></div>';
      const locked = state.teams.filter(t=>r.teamSubs[t.id]).length;
      const submitted = Object.keys(r.treeSubs||{}).length;
      const foldingDone = r.folding.status==='ended' || r.status==='scored';
      const allSubmitted = submitted===state.teams.length;
      html += '<div class="round-flow">'
        +'<div class="round-flow-step '+(locked===state.teams.length?'done':r.status==='open'?'active':'')+'"><span class="step-number">1</span><span>Assignments<br><strong>'+locked+'/'+state.teams.length+' locked</strong></span></div>'
        +'<div class="round-flow-step '+(foldingDone?'done':r.folding.status==='running'?'active':'')+'"><span class="step-number">2</span><span>Tree folding<br><strong>'+(!foldingDone&&r.folding.status==='running'?'In progress':foldingDone?'Complete':'Waiting')+'</strong></span></div>'
        +'<div class="round-flow-step '+(allSubmitted?'done':foldingDone?'active':'')+'"><span class="step-number">3</span><span>Record results<br><strong>'+submitted+'/'+state.teams.length+' submitted</strong></span></div>'
        +'</div>';
      if(isCurrent && r.status==='open'){
          if(r.folding.status!=='locked'){
            html += '<div class="panel tree-entry-panel"><div class="panel-head"><h3>Record folded trees</h3><span class="badge '+(allSubmitted?'badge-open':'badge-warn')+'">'+submitted+'/'+state.teams.length+' complete</span></div>'

         if(r.folding.status==='locked'){

        }
      } else if(isCurrent && r.status==='scored'){
        html += '<p class="dim small">Round scored. Trigger disruptions if desired, then publish and advance.</p>'
          +'<div class="row"><button class="btn btn-green" onclick="publishLeaderboard()">Publish Leaderboard</button>'
          +'<button class="btn btn-amber" onclick="unlockNextRound()">'+(r.number<state.session.numRounds?'Unlock Round '+(r.number+1):'Close Session')+'</button></div>';
      } else if(r.status==='scored'){
        html += '<div class="tree-entry-panel"><div class="panel-head"><h3>Folded trees recorded</h3><span class="badge badge-open">'+submitted+'/'+state.teams.length+' complete</span></div>'
          +'<div class="tree-entry-grid">'
          +state.teams.map(team=>'<div class="tree-entry-card complete"><label>'+esc(team.name)+'</label><span class="mono">'+(r.treeSubs[team.id]??'—')+' trees</span></div>').join('')
          +'</div></div><p class="dim small" style="margin-top:12px;">Score: '+state.teams.map(t=>esc(t.name)+' '+(r.results[t.id]??'—')).join(' · ')+'</p>';
      } else {
        html += '<p class="dimmer small">Not yet reached.</p>';
      }
      html += '</div>';
    });
  }

  if(state.gameClosed){
    const winner = state.teams.find(t=>t.id===state.winnerTeamId);
    html += '<div class="panel" style="border-color:var(--amber);"><div class="panel-head"><h3>Session Closed</h3></div>'
      +'<p>Winner: <strong style="color:var(--amber);">'+esc(winner?winner.name:'—')+'</strong></p>'
      +(state.winnerTeamId?'':'<button class="btn btn-amber" onclick="declareWinner()">Declare Winner</button>')
      +'</div>';
  }
  return html;
}

function renderAdminScoring(){
  const judges = judgeCount();
  const locked = state.phaseStatus.evp==='closed';
  let html = '<div class="panel"><div class="panel-head"><h3>EVP Judge Scoring</h3><span class="hint">Rapid entry · '+judges+' judges</span></div>'
    +'<p class="dim small">Calculate each judge’s rubric total offline, then enter one final score out of 100 per judge and team. The application averages the judge totals automatically.</p>'
    +'<div class="kv"><span>Rubric criteria</span><span class="small">'+EVP_CRITERIA.map(c=>esc(c.label)).join(' · ')+'</span></div></div>'
    +'<div class="panel"><table><thead><tr><th>Team</th>'+Array.from({length:judges},(_,i)=>'<th>Judge '+(i+1)+' / 100</th>').join('')+'<th>Average</th></tr></thead><tbody>'
    +state.teams.map(team=>{
      const score = calculateEVPScore(team);
      return '<tr><td><span class="color-dot" style="background:'+team.color+'"></span> '+esc(team.name)+'</td>'
        +Array.from({length:judges},(_,judge)=>'<td><input type="number" min="0" max="100" step="1" style="width:82px;" value="'+((team.evpJudgeTotals||[])[judge]??'')+'" '+(locked?'disabled':'')+' onchange="setEVPJudgeTotal(\''+team.id+'\','+judge+',this.value)"></td>').join('')
        +'<td class="mono" id="evpAverage_'+team.id+'" style="font-weight:700;">'+(score===null?'—':score)+'</td></tr>';
    }).join('')
    +'</tbody></table></div>';

  html += '<div class="panel"><div class="panel-head"><h3>Round Production Results</h3><span class="hint">Operational × folding multiplier = operational + multiplier</span></div>';
  const scored = state.rounds.filter(r=>r.status==='scored');
  if(scored.length){
    html += '<table><thead><tr><th>Team</th>'+scored.map(r=>'<th>Round '+r.number+' Operational / Operational + Multiplier</th>').join('')+'<th>Operational</th><th>Operational + Multiplier</th></tr></thead><tbody>'
      +state.teams.map(t=>'<tr><td>'+esc(t.name)+'</td>'+scored.map(r=>'<td class="mono">'+(r.treeResults[t.id]?r.treeResults[t.id].base+' / '+r.results[t.id]:(r.results[t.id]??'—'))+'</td>').join('')+'<td class="mono">'+t.rawOperational+'</td><td class="mono" style="font-weight:700;">'+t.operational+'</td></tr>').join('')
      +'</tbody></table>';
  } else {
    html += '<p class="dim small">No rounds scored yet.</p>';
  }
  html += '</div>';
  return html;
}

function renderAdminDisruptions(){
  const teamId = state.ui.selectedEventTeam || (state.teams[0] && state.teams[0].id) || '';
  const team = state.teams.find(t=>t.id===teamId);
  const roster = team ? teamRoster(team).filter(t=>t.active) : [];
  const talentId = state.ui.selectedEventTalent || (roster[0] && roster[0].id) || '';

  let html = '<div class="panel"><div class="panel-head"><h3>Trigger Disruption</h3><span class="hint">Round '+(state.session.currentRound||'—')+'</span></div>';
  if(state.session.currentRound===0){
    html += '<p class="dim small">Disruptions become available once Round 1 is open.</p></div>';
    return html;
  }
  html += '<div class="grid grid-3">'
    +'<div class="field"><label>Event Type</label><select onchange="state.ui.selectedEventType=this.value;render();">'
      +['Retirement','Rotation','Resignation','LEAP'].map(o=>'<option value="'+o+'" '+(state.ui.selectedEventType===o?'selected':'')+'>'+o+'</option>').join('')
    +'</select></div>'
    +'<div class="field"><label>Target Team</label><select onchange="state.ui.selectedEventTeam=this.value; state.ui.selectedEventTalent=\'\'; render();">'
      +state.teams.map(t=>'<option value="'+t.id+'" '+(teamId===t.id?'selected':'')+'>'+esc(t.name)+'</option>').join('')
    +'</select></div>'
    +'<div class="field"><label>Target Talent</label><select onchange="state.ui.selectedEventTalent=this.value;render();">'
      +roster.map(t=>'<option value="'+t.id+'" '+(talentId===t.id?'selected':'')+'>'+esc(t.name)+' ('+t.tier+')</option>').join('')
    +'</select></div>'
    +'</div>'
    +'<p class="dim small">'+disruptionBlurb(state.ui.selectedEventType)+'</p>'
    +'<button class="btn btn-red" onclick="fireEvent()">Trigger Event</button>'
    +'</div>';

  html += '<div class="panel"><div class="panel-head"><h3>Event Log</h3></div>'
    +(state.events.length ? state.events.map(e=>{
        const t = state.teams.find(x=>x.id===e.targetTeamId);
        return '<div class="event-card" style="margin-bottom:8px;"><div class="event-icon">'+e.type.slice(0,2).toUpperCase()+'</div>'
          +'<div><div style="font-weight:600;">'+e.type+' · '+esc(t?t.name:'')+' · Round '+e.round+'</div>'
          +'<div class="dim small">'+esc(e.description)+'</div></div></div>';
      }).join('') : '<p class="dim small">No events triggered yet.</p>')
    +'</div>';
  return html;
}
function disruptionBlurb(type){
  return type==='Retirement' ? 'Permanently removes the talent from the roster and clears their current-round placement.'
    : type==='Rotation' ? 'Clears the talent\'s current-round placement; team must re-place them before locking.'
    : type==='Resignation' ? 'Removes the talent from the roster entirely; team may recruit a replacement if budget allows.'
    : 'Composite event: clears current placement and grants the team a +10 Operational bonus this round.';
}
function fireEvent(){
  const teamId = state.ui.selectedEventTeam || state.teams[0].id;
  const team = state.teams.find(t=>t.id===teamId);
  const roster = teamRoster(team).filter(t=>t.active);
  const talentId = state.ui.selectedEventTalent || (roster[0] && roster[0].id);
  if(!talentId){ toast('No eligible talent on that roster.','warn'); return; }
  triggerDisruptionEvent(state.ui.selectedEventType, teamId, talentId);
  persistAndRender();
}

function renderAdminLogs(){
  return '<div class="panel"><div class="panel-head"><h3>Facilitator Action Log</h3><span class="hint">'+state.logs.length+' entries</span></div>'
    +(state.logs.length ? '<table><thead><tr><th>Time</th><th>Action</th><th>Team</th><th>Detail</th></tr></thead><tbody>'
      +state.logs.map(l=>{
        const t = l.teamId ? state.teams.find(x=>x.id===l.teamId) : null;
        return '<tr><td class="mono small">'+new Date(l.timestamp).toLocaleTimeString()+'</td><td>'+l.type+'</td><td>'+(t?esc(t.name):'—')+'</td><td class="dim small">'+esc(l.details)+'</td></tr>';
      }).join('')+'</tbody></table>' : '<p class="dim small">No actions logged yet.</p>')
    +'</div>';
}

function renderAdminConsole(){
  let body = '';
  switch(state.ui.adminTab){
    case 'phases': body = renderAdminPhases(); break;
    case 'scoring': body = renderAdminScoring(); break;
    case 'disruptions': body = renderAdminDisruptions(); break;
    case 'leaderboard': body = renderLeaderboardTable()+ (state.leaderboardPublished?'':'<div class="panel"><button class="btn btn-green" onclick="publishLeaderboard()">Publish to Teams</button></div>') + (state.gameClosed && !state.winnerTeamId ? '<div class="panel"><button class="btn btn-amber" onclick="declareWinner()">Declare Winner</button></div>' : ''); break;
    case 'logs': body = renderAdminLogs(); break;
    default: body = renderAdminTeams();
  }
  return '<div class="main">'+adminNav()+'<div class="content">'+body+'</div></div>';
}

/* ============================== ROOT RENDER ============================== */

function render(){
  const app = document.getElementById('app');
  let html = '';
  if(!state.role){
    html = renderTopbar() + renderLogin();
  } else if(state.role.type==='facilitator'){
    html = renderTopbar() + renderAdminConsole();
  } else {
    html = renderTopbar() + renderTeamPortal();
  }
  html += '<div class="footer-tick"><span>Workforce Strategy Simulation · '+(sharedDb?'shared session':'browser-local session')+'</span><span>'+new Date().toLocaleString()+'</span></div>';
  html += renderConfirmModal();
  app.innerHTML = html;
}

render();
initSharedSync();
</script>
</body>
</html>
